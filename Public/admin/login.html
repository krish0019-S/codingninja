<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Rudraksh</title>
    <link rel="icon" href="/images/Rfavicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body admin-auth-body">
    <main class="admin-auth-page">
        <section class="admin-auth-card admin-modal">
            <div class="admin-auth-header">
                <img class="admin-auth-logo" src="/images/Rfavicon.png" alt="Rudraksh Creation">
                <p class="admin-auth-title">Rudraksh Creation Admin</p>
            </div>

            <div id="adminLoginPanel" class="admin-auth-panel">
                <h1 class="admin-auth-heading">Admin Login</h1>
                <p class="text-muted">Enter your admin credentials to access the portal.</p>
                <form id="adminLoginForm">
                    <div class="mb-3">
                        <label class="form-label" for="tlemail">Admin Email</label>
                        <input type="email" class="form-control" name="email" id="tlemail" value="krishtanwar153@gmail.com" readonly required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="tlpwd">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="tlpwd" name="pwd" placeholder="Password" required>
                            <button class="btn password-toggle" type="button" data-target="#tlpwd" aria-label="Toggle password visibility">
                                <span class="eye eye-closed">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle>
                                    </svg>
                                </span>
                                <span class="eye eye-open">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                        <path d="M10.5 10.5a2 2 0 0 0 2.8 2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                        <path d="M9.5 5.5A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-4.1 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                        <path d="M6.2 6.2A17.6 17.6 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 4.3-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <p class="login-error" id="adminLoginError">Invalid ID or password.</p>
                    <button type="submit" id="lbtn" class="btn btn-primary w-100">Login</button>
                    <button type="button" class="btn btn-link w-100 mt-2" id="forgotLink">Forgot password?</button>
                </form>
            </div>

            <div id="adminResetPanel" class="admin-auth-panel d-none">
                <h2 class="admin-auth-heading">Reset Password</h2>
                <p class="text-muted">Generate a 6-digit reset code and set a new password.</p>
                <form id="adminResetForm">
                    <div class="mb-3">
                        <label class="form-label">Admin Email</label>
                        <input type="email" class="form-control" name="email" value="krishtanwar153@gmail.com" readonly required>
                    </div>
                    <div class="mb-3 d-grid">
                        <button type="button" class="btn btn-outline-primary" id="sendResetCode">Send Reset Code</button>
                        <small class="text-muted mt-2" id="resetTokenHint"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reset Code</label>
                        <input type="text" class="form-control" name="token" placeholder="6-digit code" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="adminNewPassword">New Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="adminNewPassword" name="newPassword" placeholder="Min 6 characters" required>
                            <button class="btn password-toggle" type="button" data-target="#adminNewPassword" aria-label="Toggle password visibility">
                                <span class="eye eye-closed">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle>
                                    </svg>
                                </span>
                                <span class="eye eye-open">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                        <path d="M10.5 10.5a2 2 0 0 0 2.8 2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                                        <path d="M9.5 5.5A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-4.1 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                        <path d="M6.2 6.2A17.6 17.6 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 4.3-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </span>
                            </button>
                        </div>
                    </div>
                    <p class="login-error" id="adminResetError">Unable to reset password.</p>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                    <button type="button" class="btn btn-link w-100 mt-2" id="backToLogin">Back to login</button>
                </form>
            </div>
        </section>
    </main>

    <script src="/admin/login.js"></script>
</body>
</html>
